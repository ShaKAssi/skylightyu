<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>光·遇 helper</title>

    <link rel="stylesheet" href="style.css">  
    <link rel="icon" type="image/png" href="./favicon.png">
</head>

<body>
    <main class="container">

        <!-- Время сервера -->
        <section class="clock-section">
            <div class="location">
                Время сервера (UTC+8)
            </div>

            <div id="clock" class="clock">
                Загрузка...
            </div>
        </section>

        <!-- Фарм -->
        <section class="farm-section">
            <h1>🕯️ Фарм</h1>
        
            <div id="farm-list" class="schedule-grid">
                Загрузка расписания...
            </div>
        </section>
        
        <!-- Осколки -->
        <section class="shards-section">
            <h1>💠 Осколки</h1>
        
            <div id="shards-list" class="schedule-grid">
                Загрузка расписания...
            </div>
        </section>
        
        <!-- Календарь -->
        <section class="calendar-section">
            <h1>📅 Календарь осколков</h1>
        
            <div id="shards-calendar" class="shards-calendar">
                Загрузка...
            </div>
        </section>

    </main>
  
    <!-- Социальные сети -->
    <footer class="social-links">
      <h1>Социальные сети автора🌸</h1>
        <a href="https://t.me/skylightyu" target="_blank" rel="noopener noreferrer">
            Telegram
        </a>

        <a href="https://tiktok.com/@skylightyu" target="_blank" rel="noopener noreferrer">
            TikTok
        </a>
    </footer>
  
    <script src="app.js"></script>
</body>
</html>
